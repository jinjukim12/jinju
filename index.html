<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>김진주</title>

  <style>
    body {
      margin: 0;
      background-color: white;
      font-family: Arial, "Noto Sans KR", sans-serif;
      text-align: center;
    }

    .container {
      margin-top: 50px;
    }

    .profile-image {
      width: 180px;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }

    .name {
      margin-top: 20px;
      font-size: 32px;
      font-weight: bold;
      color: #222;
    }

    .homework-title {
      margin-top: 40px;
      font-size: 28px;
      font-weight: bold;
      color: #222;
    }

    .homework-image {
      margin-top: 20px;
      width: 600px;
      max-width: 90%;
      height: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 증명사진 -->
    <img
      src="./증명사진.jpg"
      alt="김진주 프로필 사진"
      class="profile-image"
    >

    <!-- 학번 이름 -->
    <div class="name">
      2026210275 김진주
    </div>

    <!-- Homework 1 -->
    <div class="homework-title">
      #homework1
    </div>

    <!-- Qiskit 사진 -->
    <img
      src="./qiskit.jpg"
      alt="Homework 1 Qiskit"
      class="homework-image"
    >

  </div>

</body>
</html>
